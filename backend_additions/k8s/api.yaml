---
# api-deployment.yaml — Flip Bills API Kubernetes Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flipbills-api
  labels:
    app: flipbills-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flipbills-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # zero-downtime deploys
  template:
    metadata:
      labels:
        app: flipbills-api
    spec:
      containers:
        - name: api
          image: ghcr.io/elvinique/flip-bills-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: flipbills-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
# api-service.yaml
apiVersion: v1
kind: Service
metadata:
  name: flipbills-api
spec:
  selector:
    app: flipbills-api
  ports:
    - port: 80
      targetPort: 8080
  type: LoadBalancer
---
# hpa.yaml — HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flipbills-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flipbills-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
