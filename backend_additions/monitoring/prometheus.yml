global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'flipbills-api'
    static_configs:
      - targets: ['api:8080']
    metrics_path: '/metrics' # Note: Make sure to expose a /metrics endpoint in Gin (e.g. gin-prometheus)

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692'] # RabbitMQ prometheus plugin port
