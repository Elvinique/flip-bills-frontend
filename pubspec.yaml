name: flip_bills
description: "Flip Bills unified transactional super-app ledger workflow."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Reactive State Management Architecture Core
  flutter_bloc: ^8.1.6
  equatable: ^2.0.8

  # Network Pooling (Parallel Worker API Client)
  dio: ^5.9.2

  # Cryptographic Storage & Database Matrix
  sqflite: ^2.4.2+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.2.2
  path: ^1.9.0

  # Hardware Security (Biometrics Integration)
  local_auth: ^2.3.0

  # Professional Typography & Design
  google_fonts: ^6.3.3
  flutterwave_standard: ^1.1.0

  # Navigation — Named routes with auth guards
  go_router: ^14.3.0

  # QR Code generation (offline tickets)
  qr_flutter: ^4.1.0

  # Internationalisation & currency formatting
  intl: ^0.19.0

  # Runtime permissions (notifications)
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
